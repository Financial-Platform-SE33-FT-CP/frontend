name: CI - Frontend

on:
  push:
    branches: [develop]
    paths:
      - "**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        working-directory: .
        run: npm run lint

      - name: Type check
        working-directory: .
        run: npm run type-check

      - name: Format check
        working-directory: .
        run: npm run format:check
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run unit tests
        working-directory: .
        run: npm run test:unit

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/**
          retention-days: 7

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-type, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build
        working-directory: .
        run: npm run build
